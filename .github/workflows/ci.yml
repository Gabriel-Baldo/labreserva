name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labreserva
          POSTGRES_PASSWORD: labreserva
          POSTGRES_DB: labreserva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labreserva -d labreserva"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://labreserva:labreserva@localhost:5432/labreserva
      JWT_SECRET: segredo-de-ci
      JWT_EXPIRES_IN: 1h
      COOKIE_NAME: labreserva_token
      SEED_PASSWORD: Senha@CI123
      PORT: 3001
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx jest --coverage --coverageThreshold='{"global":{"lines":60}}'
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: node dist/main.js &
      - run: npx wait-on http-get://localhost:3001/api/docs --timeout 60000
      - run: node test/fluxo.e2e.mjs
        env:
          API_URL: http://localhost:3001/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
